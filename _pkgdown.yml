url: https://gtstats.thinkdenominator.com/

home:
  title: "gtstats — Descriptive and Inferential Statistics to Publication-Ready Tables"
  description: >
    A beginner-friendly R workflow for understanding data, creating Table 1,
    and comparing groups with transparent, publication-ready output.
  links:
  - text: "ThinkDenominator"
    href: https://thinkdenominator.com

template:
  bootstrap: 5
  bootswatch: litera
  includes:
    in_header: |
      <link rel="stylesheet" href="https://thinkdenominator.com/analytics-consent.css">
      <script>window.TD_GA_MEASUREMENT_ID = "G-79N51G5HW4";</script>
      <script defer src="https://thinkdenominator.com/analytics-consent.js"></script>
  bslib:
    primary: "#C0392B"
    link-color: "#C0392B"
    navbar-bg: "#1C1C1E"
    navbar-dark: true
    body-bg: "#FAFAF8"
    body-color: "#1C1C1E"
    base_font: "system-ui"
    heading_font: "Georgia"
    code_font: "monospace"
  css: pkgdown/extra.css

navbar:
  structure:
    left:  [intro, workflow, articles, reference]
    right: [search, github]
  components:
    intro:
      text: "Start here"
      href: articles/getting-started.html
    workflow:
      text: "Case study"
      href: articles/birthweight-case-study.html
    articles:
      text: "Articles"
      menu:
        - text: "Getting started"
          href: articles/getting-started.html
        - text: "Using the gtstats App"
          href: articles/gtstats-manual.html
        - text: "Birth-weight case study"
          href: articles/birthweight-case-study.html
        - text: "Function map"
          href: articles/overview.html
        - text: "Function options"
          href: articles/function-options.html
        - text: "Teaching datasets"
          href: articles/teaching-datasets.html
        - text: "Citing gtstats"
          href: articles/citation.html
        - text: "Missing data and denominators"
          href: articles/missing-data-denominators.html
        - text: "---"
        - text: "Summary tables and customisation"
          href: articles/descriptive-tables.html
        - text: "Inferential tests and assumptions"
          href: articles/inferential-tests.html
        - text: "Automatic test algorithm"
          href: articles/inferential-tests.html#default-selection-policy
        - text: "Epidemiology helpers"
          href: articles/epi-helpers.html
        - text: "Styling and exporting tables"
          href: articles/styling-export.html
        - text: "Already calculated result tables"
          href: articles/styling-export.html#format-statistics-calculated-elsewhere
    reference:
      text: "Reference"
      href: reference/index.html
    github:
      icon: fa-github
      href: https://github.com/thinkdenominator/gtstats
      aria-label: GitHub

articles:
  - title: "Start here"
    navbar: ~
    contents:
      - getting-started
      - gtstats-manual
      - birthweight-case-study
      - overview
      - function-options
      - teaching-datasets
      - citation
      - missing-data-denominators
  - title: "Workflows and details"
    navbar: "Deep dives"
    contents:
      - descriptive-tables
      - inferential-tests
      - epi-helpers
      - styling-export

reference:
  - title: "Teaching datasets"
    desc: "Built-in, labelled datasets for reproducible learning and examples."
    contents:
      - birthwt
      - trial_data
      - paired_data
      - outbreak_data
      - surveillance_data

  - title: "Guided interface"
    desc: "A point-and-click companion that generates reproducible gtstats code."
    contents:
      - gtstats_app

  - title: "1. Understand the data"
    desc: "Understand variable types, missing data, and distributions before analysis."
    contents:
      - describe_data
      - assess_distribution
      - assess_variance

  - title: "2. Describe and compare"
    desc: "Test whether groups differ and quantify associations."
    contents:
      - compare_groups
      - effect_size
      - correlation
  - title: "3. Inspect decisions"
    desc: "Inspect assumptions, diagnostic checks, and every analysis denominator."
    contents:
      - assumptions_stats
      - diagnostics_stats
      - denominators_stats
  - title: "Plots"
    desc: "Visualise group comparisons and statistical outputs."
    contents:
    - plot_compare
    - plot_correlation

  - title: "Epidemiology"
    desc: >
      Proportions with Wilson score confidence intervals by default (exact
      binomial optional), event rates with exact Poisson confidence intervals,
      and 2x2 tables with RR, OR, and RD.
    contents:
      - epi_table
      - proportion_stats
      - rate_stats
      - crosstabs

  - title: "Build a descriptive table"
    desc: >
      Build the descriptive foundation, then add confidence intervals,
      comparisons, or specialist rows only when required.
    contents:
      - summary_table
      - add_ci
      - add_p
      - add_proportion
      - add_rate
      - add_total
      - add_row
      - add_summary

  - title: "Render, style, and export"
    desc: "Preserve already calculated tables, render as flextable by default, apply publication styling, export to Office, or opt into gt for HTML."
    contents:
      - as_stats_table
      - customise_table
      - to_flextable
      - to_gt
      - save_output
  - title: "Print methods"
    desc: "S3 print methods called automatically when printing gtstats objects to the console."
    contents:
      - starts_with("print.")

footer:
  structure:
    left:  developed_by
    right: built_with
  components:
    developed_by: >
      Developed by <a href="https://thinkdenominator.com">ThinkDenominator</a>.
      <button type="button" class="td-cookie-settings" data-td-cookie-settings>Cookie settings</button>
